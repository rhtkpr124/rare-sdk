name: rare-cli compatibility

on:
  pull_request:
  workflow_dispatch:
    inputs:
      cli_ref:
        description: rare-cli branch, tag, or commit to test
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: rare-cli-compat-${{ github.workflow }}-${{ github.ref }}-${{ inputs.cli_ref || 'main' }}
  cancel-in-progress: true

jobs:
  packed-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out candidate SDK
        uses: actions/checkout@v4
        with:
          path: rare-sdk

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rare-sdk/package-lock.json

      - name: Build and pack candidate SDK
        working-directory: rare-sdk
        run: |
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/rare-sdk-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/rare-sdk-package"
          SDK_TARBALL=$(find "$RUNNER_TEMP/rare-sdk-package" -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$SDK_TARBALL"
          echo "SDK_TARBALL=$SDK_TARBALL" >> "$GITHUB_ENV"

      - name: Check out rare-cli
        uses: actions/checkout@v4
        with:
          repository: superrare/rare-cli
          ref: main
          path: rare-cli

      - name: Resolve and pin rare-cli ref
        env:
          REQUESTED_CLI_REF: ${{ inputs.cli_ref }}
          COMPANION_CLI_REF: ${{ github.head_ref }}
        working-directory: rare-cli
        run: |
          if [ -n "$REQUESTED_CLI_REF" ]; then
            CLI_REF="$REQUESTED_CLI_REF"
          elif [ -n "$COMPANION_CLI_REF" ] && git ls-remote --exit-code --heads origin "$COMPANION_CLI_REF" >/dev/null 2>&1; then
            CLI_REF="$COMPANION_CLI_REF"
          else
            CLI_REF=main
          fi
          git fetch --no-tags origin "$CLI_REF"
          git checkout --detach FETCH_HEAD
          CLI_SHA=$(git rev-parse HEAD)
          echo "Testing rare-cli ref $CLI_REF at $CLI_SHA"
          echo "CLI_REF=$CLI_REF" >> "$GITHUB_ENV"
          echo "CLI_SHA=$CLI_SHA" >> "$GITHUB_ENV"

      - name: Install rare-cli dependencies
        working-directory: rare-cli
        run: npm ci

      - name: Install exact candidate SDK without changing manifests
        working-directory: rare-cli
        run: |
          npm install --no-save --package-lock=false "$SDK_TARBALL"
          git diff --exit-code -- package.json package-lock.json

      - name: Build rare-cli
        working-directory: rare-cli
        run: npm run build

      - name: Typecheck rare-cli tests
        working-directory: rare-cli
        run: npm run test:typecheck

      - name: Run rare-cli non-live tests
        working-directory: rare-cli
        run: npm test
